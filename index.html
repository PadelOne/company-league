<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padel One League · Entreprises</title>
<style>
:root{
  --gold:#d6a63a; --gold-l:#f3d27a; --gold-d:#a87a1c;
  --ink:#111; --bg:#f5f3ee; --card:#fff; --line:#e6e1d6; --muted:#7a7366;
  --ok:#1d8a4f; --ok-bg:#e7f5ec; --bad:#c23a2b; --bad-bg:#fbeceA;
  --acc:#d6a63a; --r:14px;
  --sh:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:17px;margin-bottom:12px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#0d0d0d,#1a1712);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:52px;height:52px}
.brand b{display:block;font-size:17px;letter-spacing:.04em;color:var(--gold-l)}
.brand span{font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.55);text-transform:uppercase}
.evbadge{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
.evbadge .lg{width:64px;height:40px;background:#fff;border-radius:8px;display:grid;place-items:center;padding:4px;flex:none}
.evbadge .lg img{max-width:100%;max-height:100%}
.evbadge b{display:block;font-size:14px}
.evbadge small{color:rgba(255,255,255,.55)}
.side nav{display:grid;gap:3px}
.side nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.78);text-decoration:none;font-weight:500;cursor:pointer}
.side nav a:hover{background:rgba(255,255,255,.06)}
.side nav a.on{background:rgba(214,166,58,.16);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.side nav a.livelink{color:var(--gold-l)}
.side .foot{margin-top:auto;font-size:12px;color:rgba(255,255,255,.4)}
.main{padding:28px 34px 60px;max-width:1280px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph p{margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:#cfc6b4}
.btn.pri{background:#111;color:var(--gold-l);border-color:#111}
.btn.pri:hover{background:#2a2621}
.btn.gold{background:linear-gradient(180deg,var(--gold-l),var(--gold));border-color:var(--gold-d);color:#1a1307}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:#3d382f}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
textarea{min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-l);border-color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:#5a5348;text-align:left}
.seg button.on{background:#111;color:var(--gold-l)}
.seg button small{display:block;font-weight:400;font-size:12px;opacity:.75}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:#f1ece1;color:#5a5348}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.f{background:#fbe7f0;color:#a3346a}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--ok-bg);color:#14532d;font-size:14px}
.chk.bad{background:var(--bad-bg);color:#7f1d1d}
.chk.warn{background:#fff6e0;color:#7a5200}
.rounds{display:grid;gap:16px}
.round h3{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.mt .ct{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-d);font-weight:700;display:flex;justify-content:space-between}
.mt .tm{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0}
.mt .tm+.tm{border-top:1px dashed var(--line)}
.mt .nm{font-weight:600;font-size:14px;line-height:1.25}
.mt .nm small{color:var(--muted);font-weight:500}
.mt .lv{font-size:12px;color:var(--muted);white-space:nowrap}
.mt input.sc{width:54px;text-align:center;font-weight:700;font-size:18px;padding:6px}
.mt.win-a .tm.a .nm,.mt.win-b .tm.b .nm{color:#000}
.mt.done{border-color:#cbe6d4;background:#fbfefc}
.rest{font-size:13px;color:var(--muted);margin-top:8px}
.plist td input[type=text]{padding:6px 8px}
.plist td input[type=number]{width:80px;padding:6px 8px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.evlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.evc{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:16px;display:grid;gap:10px;cursor:pointer;box-shadow:var(--sh)}
.evc:hover{border-color:var(--gold)}
.evc .lgs{display:flex;align-items:center;gap:10px;height:44px}
.evc .lgs img{max-height:44px;max-width:120px}
.evc .x{font-weight:300;color:var(--muted)}
.logo-up{display:flex;gap:16px;align-items:center}
.logo-up .pv{width:200px;height:90px;border:1px dashed #cfc6b4;border-radius:12px;display:grid;place-items:center;background:#fff;padding:10px}
.logo-up .pv.dark{background:#111}
.logo-up .pv img{max-width:100%;max-height:100%}
.matrix td{font-size:13px;white-space:nowrap}
.matrix td.r{color:var(--muted);font-style:italic}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111;color:var(--gold-l);padding:10px 18px;border-radius:12px;font-weight:600;box-shadow:var(--sh);z-index:99}
.timerbox{display:flex;align-items:center;gap:12px;background:#111;color:#fff;border-radius:12px;padding:8px 10px 8px 16px}
.timerbox b{font-size:24px;font-variant-numeric:tabular-nums;color:var(--gold-l);min-width:76px}
.timerbox .btn{background:#2a2621;border-color:#3a342c;color:#fff}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;margin:6px 0 18px}
.pod{border-radius:16px;padding:18px 14px;text-align:center;color:#fff;background:#1a1712}
.pod .m{font-size:34px}
.pod b{display:block;font-size:18px;margin-top:6px}
.pod.p1{background:linear-gradient(180deg,#2b2214,#111);border:1px solid var(--gold);padding-top:34px}
.pod.p1 b{color:var(--gold-l);font-size:22px}

/* ---------- LIVE SCREEN ---------- */
div.live{position:fixed;inset:0;background:radial-gradient(ellipse at top,#26201a,#0a0908 70%);color:#fff;display:grid;grid-template-rows:auto 1fr;padding:1.6vw 2vw;gap:1.2vw;overflow:hidden}
.live .hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.live .hd .l{display:flex;align-items:center;gap:1.2vw}
.live .hd .l img.po{height:5.4vw}
.live .hd .l .x{font-size:2vw;color:rgba(255,255,255,.4);font-weight:200}
.live .hd .l .cl{height:4vw;background:#fff;border-radius:.6vw;padding:.5vw .9vw;display:flex;align-items:center}
.live .hd .l .cl img{max-height:100%;max-width:14vw}
.live .hd .c{text-align:center}
.live .hd .c b{display:block;font-size:2.4vw;letter-spacing:.14em;color:var(--gold-l);font-weight:800}
.live .hd .c span{font-size:1vw;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.live .hd .r{text-align:right}
.live .hd .r b{font-size:3vw;font-variant-numeric:tabular-nums;line-height:1}
.live .hd .r b.tmr{color:var(--gold-l)}
.live .hd .r b.end{color:#ff6b5a;animation:blink 1s infinite}
.live .hd .r span{display:block;font-size:.95vw;color:rgba(255,255,255,.6);margin-top:.3vw}
@keyframes blink{50%{opacity:.35}}
.live .bd{display:grid;grid-template-columns:1.65fr 1fr;gap:1.6vw;min-height:0}
.live .lt{display:grid;grid-template-rows:auto auto auto 1fr;gap:.8vw;min-height:0}
.live .tl{font-size:1vw;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-l);font-weight:700;display:flex;align-items:center;gap:.8vw}
.live .tl .now{background:#c23a2b;color:#fff;border-radius:99px;padding:.15vw .7vw;font-size:.75vw;letter-spacing:.1em}
.live .cg{display:grid;gap:.8vw}
.live .lm{background:rgba(20,18,15,.85);border:1px solid rgba(255,255,255,.1);border-radius:.9vw;padding:.8vw 1vw}
.live .cur .lm{border:.15vw solid var(--gold);box-shadow:0 0 2vw rgba(214,166,58,.15)}
.live .lm .ct{font-size:.75vw;letter-spacing:.15em;color:var(--gold);font-weight:700;margin-bottom:.3vw}
.live .lm .tm{display:flex;justify-content:space-between;align-items:center;padding:.35vw 0;gap:.6vw}
.live .lm .tm+.tm{border-top:1px solid rgba(255,255,255,.08)}
.live .lm .nm{font-size:1.15vw;line-height:1.25;font-weight:600;overflow:hidden}
.live .lm .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live .lm .sc{min-width:2.6vw;height:2.6vw;border-radius:.5vw;background:rgba(255,255,255,.08);display:grid;place-items:center;font-weight:800;font-size:1.5vw}
.live .lm .tm.w .sc{background:var(--gold);color:#111}
.live .lm .tm.l .nm{color:rgba(255,255,255,.55)}
.live .nx .lm{padding:.5vw .8vw}
.live .nx .lm .nm{font-size:.9vw}
.live .nx .lm .sc{display:none}
.live .rs{font-size:.95vw;color:rgba(255,255,255,.6)}
.live .rk{background:#f6f1e6;color:#111;border-radius:1.2vw;padding:1.2vw;display:flex;flex-direction:column;min-height:0}
.live .rk h4{margin:0 0 .6vw;text-align:center;font-size:1.3vw;letter-spacing:.2em}
.live .rk table th{background:#111;color:#fff;font-size:.75vw;padding:.4vw .6vw}
.live .rk table th:first-child{border-radius:.4vw 0 0 .4vw} .live .rk table th:last-child{border-radius:0 .4vw .4vw 0}
.live .rk table td{font-size:var(--rf,1.05vw);padding:calc(var(--rf,1.05vw)*.24) .6vw;border-bottom:1px solid #e3dccb}
.live .rk table td.p{font-weight:800}
.live .rk tr.top td:first-child{color:var(--gold-d);font-weight:800}
.live .btn{background:#1f1c18;color:#fff;border-color:#3a342c}
.live .fs{position:fixed;right:1vw;bottom:1vw;opacity:.25}
.live .fs:hover{opacity:1}
.live .back{position:fixed;left:1vw;bottom:1vw;opacity:.25}
.live .back:hover{opacity:1}

/* ---------- PRINT ---------- */
.print-only{display:none}
@media print{
  .side,.noprint,.toast{display:none!important}
  .shell{display:block} .main{padding:0;max-width:none}
  .card{box-shadow:none;border:0;padding:0}
  .print-only{display:block}
  body{background:#fff}
  .round{break-inside:avoid}
  .mt input.sc{border:1px solid #999}
}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.grid2,.grid3{grid-template-columns:1fr}.main{padding:20px}}
</style>
</head>

/* ---------- player import ---------- */
function parsePlayers(txt){
  const players=[],ignored=[];
  txt.split(/\r?\n/).forEach(l=>{
    const line=l.trim(); if(!line) return;
    const m=line.match(/^(.+?)[\s\t:;,–-]+(\d{1,2}(?:[.,]\d+)?)\s*(F|H|M|f|h|m)?\s*$/);
    if(!m){ignored.push(line);return}
    const name=m[1].trim().replace(/[\s:;,–-]+$/,"");
    const level=parseFloat(m[2].replace(",","."));
    let sex=m[3]?(m[3].toUpperCase()==="F"?"F":"H"):(FEMALE.has(name.split(/\s+/)[0].toLowerCase())?"F":"H");
    players.push({id:uid(),name,level,sex,active:true});
  });
  return{players,ignored};
}

/* ---------- draw engine ---------- */
function history(rounds){
  const P={},O={},games={},rests={};
  const k=(a,b)=>a<b?a+"|"+b:b+"|"+a;
  rounds.forEach(r=>{
    r.rest.forEach(id=>rests[id]=(rests[id]||0)+1);
    r.matches.forEach(m=>{
      [m.a,m.b].forEach(t=>{P[k(t[0],t[1])]=(P[k(t[0],t[1])]||0)+1;t.forEach(id=>games[id]=(games[id]||0)+1)});
      m.a.forEach(x=>m.b.forEach(y=>O[k(x,y)]=(O[k(x,y)]||0)+1));
    });
  });
  return{P,O,games,rests,k};
}
function buildRound(e,ids,H,r,lastRest){
  const lv={},sx={};e.players.forEach(p=>{lv[p.id]=+p.level||0;sx[p.id]=p.sex});
  const nCourts=Math.min(e.courts,Math.floor(ids.length/4));
  const slots=nCourts*4;
  // rests: fewest rests first, then most games, avoid back-to-back, random
  const tie={};ids.forEach(id=>tie[id]=r());
  const ord=[...ids].sort((a,b)=>(H.rests[a]||0)-(H.rests[b]||0)||((lastRest.has(a)?1:0)-(lastRest.has(b)?1:0))||(H.games[b]||0)-(H.games[a]||0)||tie[a]-tie[b]);
  const nRest=ids.length-slots;
  const rest=ord.slice(0,nRest);
  const play=ord.slice(nRest);
  if(!slots) return{matches:[],rest:ids};
  // strong half (balanced mode): by level, random tie-break each round
  const byLv=[...play].sort((a,b)=>lv[b]-lv[a]||tie[a]-tie[b]);
  const strong=new Set(byLv.slice(0,slots/2));
  const mode=e.drawMode;
  const avgTeam=play.reduce((s,id)=>s+lv[id],0)/(slots/2);
  function cost(a){
    let c=0;
    for(let i=0;i<slots;i+=4){
      const t1=[a[i],a[i+1]],t2=[a[i+2],a[i+3]];
      for(const t of[t1,t2]){
        c+=1000*(H.P[H.k(t[0],t[1])]||0);
        if(e.noWomenPair&&sx[t[0]]==="F"&&sx[t[1]]==="F")c+=3000;
        if(mode==="balanced"&&strong.has(t[0])===strong.has(t[1]))c+=400;
      }
      for(const x of t1)for(const y of t2)c+=25*(H.O[H.k(x,y)]||0);
      const s1=lv[t1[0]]+lv[t1[1]],s2=lv[t2[0]]+lv[t2[1]];
      if(mode==="balanced"){c+=40*Math.abs(s1-s2)+6*(Math.abs(s1-avgTeam)+Math.abs(s2-avgTeam))}
      else if(mode==="level"){const L=[...t1,...t2].map(x=>lv[x]);c+=35*(Math.max(...L)-Math.min(...L))+20*Math.abs(s1-s2)}
      else{c+=2*Math.abs(s1-s2)}
    }
    return c;
  }
  let best=null,bestC=Infinity;
  const restarts=mode==="random"?12:24,iters=1800;
  for(let s=0;s<restarts||(bestC>=400&&s<restarts*4);s++){
    let a;
    if(mode==="balanced"){
      const St=shuffle(byLv.filter(x=>strong.has(x)),r),W=shuffle(byLv.filter(x=>!strong.has(x)),r);
      a=[];for(let i=0;i<St.length;i++){a.push(St[i],W[i])}
    }else if(mode==="level"){a=[...byLv];for(let i=0;i<slots;i+=4){const g=a.slice(i,i+4);a.splice(i,4,g[0],g[3],g[1],g[2])}}
    else a=shuffle([...play],r);
    let c=cost(a);
    for(let it=0;it<iters;it++){
      const i=Math.floor(r()*slots),j=Math.floor(r()*slots);if(i===j)continue;
      [a[i],a[j]]=[a[j],a[i]];const c2=cost(a);
      if(c2<=c){c=c2;if(c<bestC){bestC=c;best=[...a]}}else [a[i],a[j]]=[a[j],a[i]];
      if(it%300===299&&c>=400){ // escape local minimum on hard constraints: random double swap
        const p=Math.floor(r()*slots),q=Math.floor(r()*slots);[a[p],a[q]]=[a[q],a[p]];c=cost(a);
      }
    }
    c=cost(a);
    if(c<bestC){bestC=c;best=[...a]}
  }
  let matches=[];
  for(let i=0;i<slots;i+=4)matches.push({a:[best[i],best[i+1]],b:[best[i+2],best[i+3]],sa:"",sb:""});
  if(e.courtOrder==="level")matches.sort((x,y)=>[...y.a,...y.b].reduce((s,id)=>s+lv[id],0)-[...x.a,...x.b].reduce((s,id)=>s+lv[id],0));
  else shuffle(matches,r);
  matches.forEach((m,i)=>m.court=i+1);
  return{matches,rest};
}
function isPlayed(rd){return rd.matches.some(m=>m.sa!==""||m.sb!=="")}
function generate(e,fromIdx){
  const seed=Math.floor(Math.random()*1e9),r=mulberry(seed);
  const kept=e.schedule&&fromIdx>0?e.schedule.rounds.slice(0,fromIdx):[];
  const rounds=[...kept];
  const ids=e.players.filter(p=>p.active).map(p=>p.id);
  for(let n=kept.length;n<e.rounds;n++){
    const H=history(rounds);
    const last=new Set(rounds.length?rounds[rounds.length-1].rest:[]);
    const rd=buildRound(e,ids,H,r,last);rd.n=n+1;rounds.push(rd);
  }
  e.schedule={rounds,seed,at:Date.now()};
}
function firstOpenRound(e){if(!e.schedule)return-1;return e.schedule.rounds.findIndex(rd=>rd.matches.some(m=>m.sa===""||m.sb===""))}
function firstUnplayed(e){if(!e.schedule)return 0;const i=e.schedule.rounds.findIndex(rd=>!isPlayed(rd));return i<0?e.schedule.rounds.length:i}

/* ---------- checks ---------- */
function checks(e){
  const out=[];if(!e.schedule)return out;
  const rounds=e.schedule.rounds,H=history(rounds);
  const lv={};e.players.forEach(p=>lv[p.id]=+p.level||0);
  const ids=e.players.filter(p=>p.active).map(p=>p.id);
  const g=ids.map(id=>H.games[id]||0),gmin=Math.min(...g),gmax=Math.max(...g);
  out.push(gmin===gmax?{ok:1,t:`Tout le monde joue ${gmin} matchs.`}:{warn:1,t:`Nombre de matchs inégal : de ${gmin} à ${gmax} par joueur. Le classement est calculé en moyenne par match. ${suggestRounds(e)}`});
  const rep=Object.values(H.P).filter(v=>v>1).length;
  out.push(rep?{bad:1,t:`${rep} équipe(s) se retrouvent plus d'une fois ensemble.`}:{ok:1,t:"Aucun joueur ne rejoue avec le même partenaire."});
  if(e.noWomenPair){let ff=0;const sx={};e.players.forEach(p=>sx[p.id]=p.sex);rounds.forEach(r=>r.matches.forEach(m=>[m.a,m.b].forEach(t=>{if(sx[t[0]]==="F"&&sx[t[1]]==="F")ff++})));out.push(ff?{bad:1,t:`${ff} équipe(s) 100 % féminine(s).`}:{ok:1,t:"Pas deux femmes dans la même équipe."})}
  let maxGap=0,sumGap=0,nM=0;rounds.forEach(r=>r.matches.forEach(m=>{const d=Math.abs(lv[m.a[0]]+lv[m.a[1]]-lv[m.b[0]]-lv[m.b[1]]);maxGap=Math.max(maxGap,d);sumGap+=d;nM++}));
  if(nM)out.push({[(sumGap/nM<=1&&maxGap<=2.5)?"ok":"warn"]:1,t:`Équilibre des matchs : écart moyen ${fmtLv(sumGap/nM)} pt de niveau entre les deux équipes (max ${fmtLv(maxGap)}).`});
  const oppMax=Math.max(0,...Object.values(H.O));
  out.push(oppMax<=2?{ok:1,t:`Adversaires variés : on affronte au maximum ${oppMax} fois la même personne.`}:{warn:1,t:`Certains joueurs s'affrontent ${oppMax} fois (inévitable avec peu de joueurs ou beaucoup de tours).`});
  return out;
}
function suggestRounds(e){
  const n=e.players.filter(p=>p.active).length,slots=Math.min(e.courts,Math.floor(n/4))*4,rest=n-slots;
  if(!rest)return"";
  const opts=[];for(let R=1;R<=24&&opts.length<3;R++)if((R*rest)%n===0)opts.push(R);
  return opts.length?`Pour une égalité parfaite : ${opts.map(R=>`${R} tours (${R-R*rest/n} matchs chacun)`).join(", ")}.`:"";
}

/* ---------- ranking ---------- */
function ranking(e){
  const st={};e.players.forEach(p=>st[p.id]={p,J:0,V:0,N:0,D:0,GF:0,GA:0});
  if(e.schedule)e.schedule.rounds.forEach(r=>r.matches.forEach(m=>{
    if(m.sa===""||m.sb==="")return;const a=+m.sa,b=+m.sb;
    const ap=(t,f,g)=>t.forEach(id=>{const s=st[id];if(!s)return;s.J++;s.GF+=f;s.GA+=g;if(f>g)s.V++;else if(f<g)s.D++;else s.N++});
    ap(m.a,a,b);ap(m.b,b,a);
  }));
  const L=Object.values(st).filter(s=>s.J>0||s.p.active);
  const js=new Set(L.filter(s=>s.J).map(s=>s.J));const avg=js.size>1;
  const d=s=>avg&&s.J?s.J:1;
  const key=s=>e.ranking==="games"?[s.GF/d(s),(s.GF-s.GA)/d(s),s.V/d(s)]:[s.V/d(s),s.N/d(s),(s.GF-s.GA)/d(s),s.GF/d(s)];
  L.sort((x,y)=>{if(!x.J!==!y.J)return x.J?-1:1;const a=key(x),b=key(y);for(let i=0;i<a.length;i++)if(Math.abs(a[i]-b[i])>1e-9)return b[i]-a[i];return x.p.name.localeCompare(y.p.name)});
  L.forEach((s,i)=>{s.rank=i+1;s.diff=s.GF-s.GA});
  return{list:L,avg};
}

/* ---------- horaires ---------- */
const playMin=e=>Math.max(1,(+e.rotationMin||20)-(+e.changeMin||0));
const toMin=t=>{if(!t)return null;const[h,m]=t.split(":").map(Number);return h*60+m};
const hhmm=m=>`${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const windowMin=e=>{const a=toMin(e.time),b=toMin(e.endTime);if(a==null||b==null)return null;return b>a?b-a:b+1440-a};
function roundSlot(e,i){const a=toMin(e.time);if(a==null)return null;const st=a+i*e.rotationMin;return{start:hhmm(st),end:hhmm(st+playMin(e)),next:hhmm(st+e.rotationMin)}}
const slotTxt=(e,i)=>{const s=roundSlot(e,i);return s?`${s.start} – ${s.end}`:""};
function fitRounds(){const e=ev(),w=windowMin(e);if(!w)return;e.rounds=Math.max(1,Math.floor(w/e.rotationMin));save();render();toast(`${e.rounds} tours de ${e.rotationMin} min`)}
function fitDuration(){const e=ev(),w=windowMin(e);if(!w)return;e.rotationMin=Math.max(5,Math.floor(w/e.rounds));if(e.changeMin>=e.rotationMin)e.changeMin=0;save();render();toast(`Tours de ${e.rotationMin} min`)}

/* ---------- timer ---------- */
function timerLeft(e){const t=e.timer;if(!t)return playMin(e)*60;return t.running?Math.max(0,Math.round((t.endAt-Date.now())/1000)):t.left}
function timerStart(){const e=ev();const left=timerLeft(e)||playMin(e)*60;e.timer={running:true,endAt:Date.now()+left*1000,left};save();render()}
function timerPause(){const e=ev();e.timer={running:false,left:timerLeft(e)};save();render()}
function timerReset(){const e=ev();e.timer=null;save();render()}
const mmss=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
let beeped=null;
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.3,c.currentTime+t);o.start(c.currentTime+t);o.stop(c.currentTime+t+.25)})}catch(e){}}

/* ---------- routing ---------- */
let route=location.hash.slice(2)||"events";
window.addEventListener("hashchange",()=>{route=location.hash.slice(2)||"events";render()});
function go(r){location.hash="#/"+r}
if(!S.cur&&S.events.length)S.cur=S.events[0].id;

/* ---------- render ---------- */
function render(){
  const e=ev();
  if(route==="live"&&e)return renderLive(e);
  const tabs=[["events","◎","Événements"],["setup","⚙","Réglages & branding"],["players","👥","Joueurs"],["draw","🎲","Tirage"],["scores","✎","Scores"],["results","🏆","Classement"]];
  $("#app").innerHTML=`<div class="shell">
    <aside class="side">
      <div class="brand"><img src="${PO_LOGO}" alt="Padel One"><div><b>PADEL ONE LEAGUE</b><span>Entreprises</span></div></div>
      ${e?`<div class="evbadge"><div class="lg">${e.logo?`<img src="${e.logo}">`:"<small style='color:#999'>logo</small>"}</div><div><b>${esc(e.company)}</b><small>${e.date?esc(fmtDate(e.date)):"Date à définir"}</small></div></div>`:""}
      <nav>${tabs.map(([k,i,l])=>(!e&&k!=="events")?"":`<a class="${route===k?"on":""}" onclick="go('${k}')"><span>${i}</span>${l}</a>`).join("")}
      ${e?`<a class="livelink" onclick="window.open(location.pathname+location.search+'#/live','_blank')"><span>▣</span>Écran live ↗</a>`:""}</nav>
      <div class="foot">Données enregistrées dans ce navigateur. Exportez une sauvegarde après chaque événement.</div>
    </aside>
    <main class="main">${page(e)}</main></div>`;
  after();
}
function page(e){
  switch(route){
    case"setup":return pSetup(e);case"players":return pPlayers(e);case"draw":return pDraw(e);
    case"scores":return pScores(e);case"results":return pResults(e);default:return pEvents();
  }
}
let afterFns=[];function after(){afterFns.forEach(f=>f());afterFns=[]}

function pSetup(e){

          ${e.logo?`<button class="btn sm danger" onclick="setF('logo',null)">Retirer</button>`:""}<span class="muted small">PNG, JPG ou SVG. Le logo Padel One reste toujours affiché.</span></div></div>
        <label class="f">Couleur d'accent de l'entreprise <small>Utilisée en touche sur l'écran live et les documents</small><div class="row"><input type="color" value="${esc(e.accent)}" onchange="setF('accent',this.value)" style="width:60px;height:40px;padding:2px"><span class="muted small">${esc(e.accent)}</span></div></label>

    <div class="grid3">

    <div class="grid3" style="margin-top:16px">
      <label class="f">Contrainte mixité<select onchange="setF('noWomenPair',this.value==='1',1)"><option value="1" ${e.noWomenPair?"selected":""}>Pas deux femmes ensemble</option><option value="0" ${!e.noWomenPair?"selected":""}>Aucune contrainte</option></select></label>
      <label class="f">Attribution des terrains<select onchange="setF('courtOrder',this.value,1)"><option value="random" ${e.courtOrder==="random"?"selected":""}>Aléatoire</option><option value="level" ${e.courtOrder==="level"?"selected":""}>Terrain 1 = matchs les plus forts</option></select></label>
      <label class="f">Classement<select onchange="setF('ranking',this.value)"><option value="wins" ${e.ranking==="wins"?"selected":""}>Victoires › Nuls › Différence › Jeux</option><option value="games" ${e.ranking==="games"?"selected":""}>Total de jeux gagnés (Americano)</option></select></label>
    </div>

function timingBox(e){
  const total=e.rounds*e.rotationMin,w=windowMin(e),pm=playMin(e);
  const a=toMin(e.time);
  let cls="chk",msg;
  const base=`${e.rounds} rotations × ${e.rotationMin} min = <b>${Math.floor(total/60)}h${String(total%60).padStart(2,"0")}</b> · ${pm} min de jeu par match${e.changeMin?` + ${e.changeMin} min de changement`:""}`;
  if(a==null)msg=`${base}. Indiquez l'heure de début pour obtenir l'horaire de chaque tour.`;
  else if(w==null)msg=`${base} · de ${e.time} à <b>${hhmm(a+total)}</b>.`;
  else if(total>w){cls="chk bad";msg=`${base} · fin à <b>${hhmm(a+total)}</b> : dépasse le créneau ${e.time}–${e.endTime} de <b>${total-w} min</b>.`}
  else if(w-total>=e.rotationMin){cls="chk warn";msg=`${base} · fin à <b>${hhmm(a+total)}</b> : il reste ${w-total} min libres avant ${e.endTime}.`}
  else msg=`✓ ${base} · de ${e.time} à <b>${hhmm(a+total)}</b>${w-total?` (${w-total} min de marge)`:" — pile dans le créneau"}.`;
  const btns=w?`<span class="row" style="margin-left:auto"><button class="btn sm" onclick="fitRounds()">Remplir le créneau (${Math.floor(w/e.rotationMin)} tours de ${e.rotationMin} min)</button><button class="btn sm" onclick="fitDuration()">Garder ${e.rounds} tours → ${Math.floor(w/e.rounds)} min chacun</button></span>`:"";
  const sched=a!=null?`<div class="small muted" style="margin-top:8px">${Array.from({length:e.rounds},(_,i)=>`T${i+1} ${slotTxt(e,i)}`).join(" · ")}</div>`:"";
  return`<div class="${cls}" style="margin-top:14px;flex-wrap:wrap;align-items:center"><span>${msg}</span>${btns}</div>${sched}`;
}
function formatSummary(e){
  const n=e.players.filter(p=>p.active).length,nc=Math.min(e.courts,Math.floor(n/4)),slots=nc*4,rest=n-slots;
  let s=`${n} joueurs · ${nc} terrain(s) utilisé(s) · ${slots} joueurs sur le terrain par tour`;
  if(rest)s+=` · <b>${rest} au repos à chaque tour (rotation sur tous les joueurs)</b>`;
  if(e.courts>nc&&n>=4)s+=` · ${e.courts-nc} terrain(s) libre(s)`;
  s+=".";
  const sg=suggestRounds(e);if(sg)s+=` ${sg}`;
  return s;
}
function pPlayers(e){
  const act=e.players.filter(p=>p.active).length;
  return`<div class="ph"><div><h1>Joueurs</h1><p class="muted">${act} présents · ${e.players.length-act} absents. Niveau : n'importe quelle échelle, du moment qu'elle est la même pour tous.</p></div>
    <div class="row"><button class="btn" onclick="addPlayer()">+ Ajouter</button><button class="btn" onclick="sortPlayers()">Trier par niveau</button></div></div>
  <div class="grid2" style="grid-template-columns:1.4fr 1fr;align-items:start">
  <div class="card" style="padding:8px 8px 4px"><table class="plist"><thead><tr><th>#</th><th>Joueur</th><th>Niveau</th><th>Sexe</th><th>Présent</th><th></th></tr></thead><tbody>
    ${e.players.map((p,i)=>`<tr style="${p.active?"":"opacity:.45"}"><td class="muted">${i+1}</td>
      <td><input type="text" value="${esc(p.name)}" onchange="setP('${p.id}','name',this.value)"></td>
      <td><input type="number" step="0.25" value="${p.level??""}" onchange="setP('${p.id}','level',this.value===''?null:+this.value)"></td>
      <td><select onchange="setP('${p.id}','sex',this.value)" style="width:70px;padding:6px"><option ${p.sex==="H"?"selected":""}>H</option><option ${p.sex==="F"?"selected":""}>F</option></select></td>
      <td><input type="checkbox" ${p.active?"checked":""} onchange="setP('${p.id}','active',this.checked)"></td>
      <td><button class="btn sm danger" onclick="delPlayer('${p.id}')">✕</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">Collez une liste à droite.</td></tr>`}
  </tbody></table></div>
  <div class="card"><h2>Coller une liste</h2><p class="small muted" style="margin-top:-6px">Une ligne par joueur : <code>Prénom Nom niveau</code> (ex. <code>Sébastien 6.5</code>). Ajoutez <code>F</code> à la fin pour une joueuse. Copiez directement depuis le mail de l'entreprise.</p>
    <textarea id="paste" placeholder="Nathan 6&#10;Sébastien 6.5&#10;Cynthia 0 F"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn pri" onclick="doPaste(false)">Ajouter à la liste</button><button class="btn" onclick="doPaste(true)">Remplacer la liste</button></div>
  </div></div>`;
}
function pDraw(e){
  const has=!!e.schedule,fu=firstUnplayed(e),inactiveInSched=has&&e.schedule.rounds.slice(fu).some(r=>[...r.rest,...r.matches.flatMap(m=>[...m.a,...m.b])].some(id=>!(e.players.find(p=>p.id===id)||{}).active));
  const newActive=has&&e.players.filter(p=>p.active).some(p=>!e.schedule.rounds.slice(fu).some(r=>[...r.rest,...r.matches.flatMap(m=>[...m.a,...m.b])].includes(p.id)));
  const changed=has&&(e.schedule.rounds.length!==e.rounds||inactiveInSched||newActive);
  return`<div class="ph"><div><h1>Tirage au sort</h1><p class="muted">${modeLabel(e)} · ${e.players.filter(p=>p.active).length} joueurs · ${e.courts} terrains · ${e.rounds} tours</p></div>
    <div class="row noprint">${has?`<button class="btn" onclick="window.print()">🖨 Imprimer le planning</button><button class="btn" onclick="copyWA()">Copier pour WhatsApp</button>`:""}
    <button class="btn ${has?"":"gold"}" onclick="doDraw()">🎲 ${has?"Refaire le tirage":"Effectuer le tirage"}</button></div></div>
  ${changed?`<div class="chk warn noprint" style="margin-bottom:14px">⚠ La liste des joueurs ou le format a changé depuis le tirage. ${fu>0?`<button class="btn sm" onclick="redrawFrom()">Recalculer les tours ${fu+1} à ${e.rounds} (tours joués conservés)</button>`:`<button class="btn sm" onclick="doDraw()">Refaire le tirage</button>`}</div>`:""}
  ${has?`<div class="card noprint"><h2>Contrôles</h2><div class="checks">${checks(e).map(c=>`<div class="chk ${c.bad?"bad":c.warn?"warn":""}">${c.bad?"✕":c.warn?"!":"✓"} <span>${c.t}</span></div>`).join("")}</div></div>
  <div class="print-only">${printHead(e,"Planning des matchs")}</div>
  <div class="rounds">${e.schedule.rounds.map(rd=>roundView(e,rd,false)).join("")}</div>
  <div class="card mt noprint" style="margin-top:18px"><h2>Vue par joueur</h2><div style="overflow:auto">${matrix(e)}</div></div>`
  :`<div class="card empty">Vérifiez la liste des joueurs et les réglages, puis lancez le tirage.<br><br><button class="btn gold" onclick="doDraw()">🎲 Effectuer le tirage</button></div>`}`;
}
const modeLabel=e=>({balanced:"Fort + moins fort",level:"Par niveau",random:"Aléatoire"})[e.drawMode];
function pname(e,id){const p=e.players.find(x=>x.id===id);return p?p.name:"?"}
function plv(e,id){const p=e.players.find(x=>x.id===id);return p?+p.level||0:0}
function roundView(e,rd,edit){
  return`<div class="round card" style="margin:0"><h3>Tour ${rd.n}${roundSlot(e,rd.n-1)?` <span class="muted" style="font-weight:500">· ${slotTxt(e,rd.n-1)}</span>`:""}${rd.matches.every(m=>m.sa!==""&&m.sb!=="")?` <span class="pill ok">Terminé</span>`:""}</h3>
  <div class="courts">${rd.matches.map((m,mi)=>{
    const done=m.sa!==""&&m.sb!=="",wa=done&&+m.sa>+m.sb,wb=done&&+m.sb>+m.sa;
    const team=(t,side)=>`<div class="tm ${side}"><div class="nm">${t.map(id=>esc(pname(e,id))).join("<br>")}</div>
      ${edit?`<input class="sc" inputmode="numeric" id="s-${rd.n}-${mi}-${side}" value="${side==="a"?m.sa:m.sb}" data-r="${rd.n-1}" data-m="${mi}" data-s="${side}">`:`<div class="lv">${done?`<b style="font-size:16px;color:#111">${side==="a"?m.sa:m.sb}</b>`:`niv. ${fmtLv(plv(e,t[0])+plv(e,t[1]))}`}</div>`}</div>`;
    return`<div class="mt ${done?"done":""} ${wa?"win-a":""} ${wb?"win-b":""}"><div class="ct"><span>Terrain ${m.court}</span>${edit?`<span class="muted">${fmtLv(plv(e,m.a[0])+plv(e,m.a[1]))} vs ${fmtLv(plv(e,m.b[0])+plv(e,m.b[1]))}</span>`:""}</div>${team(m.a,"a")}${team(m.b,"b")}</div>`}).join("")}</div>
  ${rd.rest.length?`<div class="rest">Au repos : <b>${rd.rest.map(id=>esc(pname(e,id))).join(", ")}</b></div>`:""}</div>`;
}
function matrix(e){
  const rounds=e.schedule.rounds;
  const ids=e.players.filter(p=>rounds.some(r=>[...r.rest,...r.matches.flatMap(m=>[...m.a,...m.b])].includes(p.id))).map(p=>p.id);
  return`<table class="matrix"><thead><tr><th>Joueur</th>${rounds.map(r=>`<th>T${r.n}</th>`).join("")}</tr></thead><tbody>
  ${ids.map(id=>`<tr><td><b>${esc(pname(e,id))}</b> <span class="muted small">${fmtLv(plv(e,id))}</span></td>${rounds.map(r=>{
    if(r.rest.includes(id))return`<td class="r">repos</td>`;
    const m=r.matches.find(m=>m.a.includes(id)||m.b.includes(id));if(!m)return"<td>–</td>";
    const t=m.a.includes(id)?m.a:m.b;const pt=t.find(x=>x!==id);
    return`<td>T${m.court} · avec <b>${esc(pname(e,pt))}</b></td>`}).join("")}</tr>`).join("")}</tbody></table>`;
}
function printHead(e,t){return`<div style="display:flex;align-items:center;gap:16px;margin-bottom:14px;border-bottom:2px solid #111;padding-bottom:10px"><img src="${PO_LOGO}" style="height:60px">${e.logo?`<span style="font-size:24px;color:#999">×</span><img src="${e.logo}" style="max-height:44px;max-width:180px">`:""}<div style="margin-left:auto;text-align:right"><b style="font-size:20px">${esc(e.title)} · ${esc(e.company)}</b><div class="muted">${t} · ${esc(fmtDate(e.date))} ${esc(e.time||"")}${e.endTime?" – "+esc(e.endTime):""} · ${esc(e.venue||"")}</div></div></div>`}
function pScores(e){
  if(!e.schedule)return`<div class="card empty">Faites d'abord le tirage.<br><br><button class="btn gold" onclick="go('draw')">Aller au tirage</button></div>`;
  const cur=firstOpenRound(e),left=timerLeft(e);
  return`<div class="ph"><div><h1>Saisie des scores</h1><p class="muted">Tapez les deux scores, <b>Entrée</b> passe au champ suivant. Le classement et l'écran live se mettent à jour instantanément.</p></div>
  <div class="timerbox"><span class="small">Chrono</span><b>${mmss(left)}</b>${e.timer&&e.timer.running?`<button class="btn sm" onclick="timerPause()">❚❚</button>`:`<button class="btn sm" onclick="timerStart()">▶</button>`}<button class="btn sm" onclick="timerReset()">↺</button></div></div>
  <div class="grid2" style="grid-template-columns:1.6fr 1fr;align-items:start">
  <div class="rounds">${e.schedule.rounds.map((rd,i)=>`<div id="rd-${i}" style="${cur>=0&&i<cur-1?"opacity:.75":""}">${roundView(e,rd,true)}</div>`).join("")}</div>
  <div class="card" style="position:sticky;top:20px"><h2>Classement en direct</h2><div id="rkpanel">${rankTable(e,false)}</div></div></div>`;
}
function rankTable(e,big){
  const{list,avg}=ranking(e);
  const gm=e.ranking==="games";
  return`<table><thead><tr><th>#</th><th>Joueur</th><th class="n">J</th><th class="n">V</th><th class="n">N</th><th class="n">D</th><th class="n">Diff</th><th class="n">${gm?"Jeux":"Jeux"}</th></tr></thead><tbody>
  ${list.map(s=>`<tr><td><b>${s.rank}</b></td><td>${esc(s.p.name)}${s.p.active?"":' <span class="pill">forfait</span>'}</td><td class="n">${s.J}</td><td class="n">${s.V}</td><td class="n">${s.N}</td><td class="n">${s.D}</td><td class="n">${s.diff>0?"+":""}${s.diff}</td><td class="n"><b>${s.GF}</b></td></tr>`).join("")}</tbody></table>
  ${avg?`<p class="small muted">Nombre de matchs inégal : classement calculé en moyenne par match.</p>`:""}`;
}
function pResults(e){
  const{list}=ranking(e);const top=list.filter(s=>s.J).slice(0,3);
  const done=e.schedule&&firstOpenRound(e)<0;
  return`<div class="ph"><div><h1>Classement ${done?"final":"provisoire"}</h1><p class="muted">${modeLabel(e)} · ${e.ranking==="games"?"total de jeux gagnés":"victoires › nuls › différence › jeux"}</p></div>
  <div class="row noprint"><button class="btn" onclick="window.print()">🖨 Imprimer / PDF</button><button class="btn" onclick="copyRanking()">Copier pour WhatsApp</button></div></div>
  <div class="print-only">${printHead(e,done?"Classement final":"Classement provisoire")}</div>
  ${top.length===3?`<div class="podium"><div class="pod"><div class="m">🥈</div><b>${esc(top[1].p.name)}</b><small>${top[1].V} V · ${top[1].diff>0?"+":""}${top[1].diff}</small></div><div class="pod p1"><div class="m">🥇</div><b>${esc(top[0].p.name)}</b><small>${top[0].V} V · ${top[0].diff>0?"+":""}${top[0].diff}</small></div><div class="pod"><div class="m">🥉</div><b>${esc(top[2].p.name)}</b><small>${top[2].V} V · ${top[2].diff>0?"+":""}${top[2].diff}</small></div></div>`:""}
  <div class="card">${rankTable(e,true)}</div>`;
}

/* ---------- LIVE ---------- */
let liveTick=null;
function renderLive(e){
  document.documentElement.style.setProperty("--acc",e.accent||"#d6a63a");
  const rounds=e.schedule?e.schedule.rounds:[];
  let ci=firstOpenRound(e);const finished=e.schedule&&ci<0;if(ci<0)ci=rounds.length-1;
  const cur=rounds[ci],nxt=rounds[ci+1];
  const nDone=rounds.flatMap(r=>r.matches).filter(m=>m.sa!==""&&m.sb!=="").length,nTot=rounds.flatMap(r=>r.matches).length;
  const{list}=ranking(e);
  const ncol=cur?Math.min(cur.matches.length,cur.matches.length>4?Math.ceil(cur.matches.length/2):cur.matches.length):1;
  const lm=(m,showSc)=>{const done=m.sa!==""&&m.sb!=="";const wa=done&&+m.sa>+m.sb,wb=done&&+m.sb>+m.sa;
    const t=(tt,sc,w,l)=>`<div class="tm ${w?"w":""} ${l?"l":""}"><div class="nm">${tt.map(id=>`<div>${esc(pname(e,id))}</div>`).join("")}</div>${showSc?`<div class="sc">${sc===""?"–":sc}</div>`:""}</div>`;
    return`<div class="lm"><div class="ct">TERRAIN ${m.court}</div>${t(m.a,m.sa,wa,wb)}${t(m.b,m.sb,wb,wa)}</div>`};
  const rowsMax=Math.min(list.length,22);
  $("#app").innerHTML=`<div class="live">
   <div class="hd"><div class="l"><img class="po" src="${PO_LOGO}">${e.logo?`<span class="x">×</span><div class="cl"><img src="${e.logo}"></div>`:`<span class="x">×</span><b style="font-size:2vw">${esc(e.company)}</b>`}</div>
    <div class="c"><b>${esc((e.title||"Padel One League").toUpperCase())}</b><span>${esc(e.company)}${e.date?" · "+esc(fmtDate(e.date)):""}${e.venue?" · "+esc(e.venue):""}</span></div>
    <div class="r" id="clk"></div></div>
   <div class="bd">
    <div class="lt">
     ${cur?`<div class="tl">${finished?"Dernier tour":"Tour "+cur.n+" / "+rounds.length}${roundSlot(e,ci)?` <span style="color:rgba(255,255,255,.6);font-weight:500">${slotTxt(e,ci)}</span>`:""} ${finished?`<span class="now" style="background:var(--gold);color:#111">TERMINÉ</span>`:`<span class="now">EN COURS</span>`}</div>
     <div class="cg cur" style="grid-template-columns:repeat(${ncol},1fr)">${cur.matches.map(m=>lm(m,true)).join("")}</div>
     ${cur.rest.length?`<div class="rs">Au repos : <b style="color:#fff">${cur.rest.map(id=>esc(pname(e,id))).join(" · ")}</b></div>`:"<div></div>"}
     <div>${nxt?`<div class="tl" style="margin-bottom:.6vw">Tour suivant · ${nxt.n}${roundSlot(e,ci+1)?` <span style="color:rgba(255,255,255,.6);font-weight:500">${roundSlot(e,ci+1).start}</span>`:""}</div><div class="cg nx" style="grid-template-columns:repeat(${Math.min(nxt.matches.length,4)},1fr)">${nxt.matches.map(m=>lm(m,false)).join("")}</div>${nxt.rest.length?`<div class="rs" style="margin-top:.5vw">Au repos ensuite : ${nxt.rest.map(id=>esc(pname(e,id))).join(" · ")}</div>`:""}`:""}</div>`
     :`<div class="tl">Tirage pas encore effectué</div>`}
    </div>
    <div class="rk" style="--rf:${Math.min(1.1,18/Math.max(rowsMax,1)).toFixed(3)}vw"><h4>${finished?"CLASSEMENT FINAL":"CLASSEMENT EN DIRECT"}</h4><table><thead><tr><th>#</th><th>Joueur</th><th class="n">J</th><th class="n">V</th><th class="n">Diff</th><th class="n">Jeux</th></tr></thead><tbody>
     ${list.slice(0,rowsMax).map(s=>`<tr class="${s.rank<=3&&s.J?"top":""}"><td>${s.rank}</td><td style="font-weight:600">${esc(s.p.name)}${s.p.active?"":' <small style="color:#a39a88">(forfait)</small>'}</td><td class="n">${s.J}</td><td class="n">${s.V}</td><td class="n">${s.diff>0?"+":""}${s.diff}</td><td class="n p">${s.GF}</td></tr>`).join("")}</tbody></table>
     <div class="small" style="margin-top:auto;padding-top:.6vw;color:#7a7366;font-size:.8vw;text-align:center">${nDone}/${nTot} matchs joués</div></div>
   </div>
   <button class="btn sm back" onclick="go('scores')">← Admin</button>
   <button class="btn sm fs" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()">⛶ Plein écran</button></div>`;
  const tick=()=>{const el=$("#clk");if(!el){clearInterval(liveTick);return}
    const t=e.timer,left=timerLeft(e);
    if(t&&(t.running||t.left!=null)){el.innerHTML=`<b class="${left===0?"end":"tmr"}">${left===0?"STOP":mmss(left)}</b><span>${new Date().toLocaleTimeString("fr-CH",{hour:"2-digit",minute:"2-digit"})} · ${t.running?"chrono du tour":"chrono en pause"}</span>`;
      if(left===0&&t.running&&beeped!==t.endAt){beeped=t.endAt;beep()}}
    else el.innerHTML=`<b>${new Date().toLocaleTimeString("fr-CH",{hour:"2-digit",minute:"2-digit"})}</b><span>${e.time&&e.endTime?`Ligue ${e.time} – ${e.endTime} · `:""}${playMin(e)} min par match</span>`};
  clearInterval(liveTick);tick();liveTick=setInterval(tick,500);
}

/* ---------- actions ---------- */
function openEv(id){S.cur=id;save();go("setup")}
function newEvent(){const e=blankEvent();S.events.unshift(e);S.cur=e.id;save();go("setup")}
function dupEvent(id){const o=S.events.find(e=>e.id===id);const e=JSON.parse(JSON.stringify(o));e.id=uid();e.company=o.company+" (copie)";e.schedule=null;e.timer=null;e.created=Date.now();e.players.forEach(p=>p.id=uid());S.events.unshift(e);S.cur=e.id;save();render();toast("Événement dupliqué (sans tirage)")}
function delEvent(id){const e=S.events.find(x=>x.id===id);if(!confirm(`Supprimer définitivement l'événement « ${e.company} » ?`))return;S.events=S.events.filter(x=>x.id!==id);if(S.cur===id)S.cur=S.events[0]?.id||null;save();render()}
function setF(k,v,affectsDraw){const e=ev();e[k]=v;save();render();if(affectsDraw&&e.schedule)toast("Pensez à refaire le tirage")}
function setP(id,k,v){const e=ev();const p=e.players.find(x=>x.id===id);p[k]=k==="name"?v.trim():v;save();render()}
function addPlayer(){ev().players.push({id:uid(),name:"Nouveau joueur",level:3,sex:"H",active:true});save();render()}
function delPlayer(id){const e=ev();const inSched=e.schedule&&e.schedule.rounds.some(r=>[...r.rest,...r.matches.flatMap(m=>[...m.a,...m.b])].includes(id));
  if(inSched){const p=e.players.find(x=>x.id===id);p.active=false;save();render();toast("Joueur présent dans le tirage : marqué absent");return}
  e.players=e.players.filter(p=>p.id!==id);save();render()}
function sortPlayers(){ev().players.sort((a,b)=>(b.level||0)-(a.level||0));save();render()}
function doPaste(replace){const t=$("#paste").value;const{players,ignored}=parsePlayers(t);if(!players.length){alert("Aucune ligne reconnue. Format : Prénom niveau (ex. Nathan 6)");return}
  const e=ev();if(replace){if(e.schedule&&!confirm("Remplacer la liste supprime aussi le tirage. Continuer ?"))return;e.players=players;e.schedule=null}else e.players.push(...players);
  save();render();toast(`${players.length} joueurs importés${ignored.length?` · ${ignored.length} ligne(s) ignorée(s)`:""}`)}
function doDraw(){const e=ev();const n=e.players.filter(p=>p.active).length;if(n<4){alert("Il faut au moins 4 joueurs présents.");return}
  if(e.schedule&&e.schedule.rounds.some(isPlayed)&&prompt("Des scores existent déjà et seront effacés. Tapez SUPPRIMER pour confirmer.")!=="SUPPRIMER")return;
  generate(e,0);e.timer=null;save();render();toast("Tirage effectué")}
function redrawFrom(){const e=ev();const fu=firstUnplayed(e);generate(e,fu);save();render();toast(`Tours ${fu+1} à ${e.rounds} recalculés`)}
function upLogo(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{if(f.type==="image/svg+xml"||/\.svg$/i.test(f.name)){if(rd.result.length>400000){alert("SVG trop lourd (>300 Ko).");return}setF("logo",rd.result);return}
    const img=new Image();img.onload=()=>{const k=Math.min(1,700/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);setF("logo",c.toDataURL("image/png"))};img.src=rd.result};
  rd.readAsDataURL(f)}
function download(name,data){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;a.click()}
function exportEv(id){const e=S.events.find(x=>x.id===id);download(`padel-one-league_${e.company.replace(/\W+/g,"-")}_${e.date||"date"}.json`,JSON.stringify({events:[e]},null,1))}
function exportAll(){download(`padel-one-league_entreprises_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S,null,1))}
function importJSON(){
  const i=document.createElement("input");i.type="file";i.accept=".json,application/json,text/plain,text/json";
  i.style.cssText="position:fixed;left:-9999px;opacity:0";document.body.appendChild(i); // Safari/iPad : l'input doit être dans la page
  i.addEventListener("change",()=>{const f=i.files&&i.files[0];i.remove();if(!f){toast("Aucun fichier choisi");return}
    const rd=new FileReader();
    rd.onerror=()=>alert("Lecture du fichier impossible.");
    rd.onload=()=>{let d;try{d=JSON.parse(String(rd.result).replace(/^﻿/,""))}catch(err){alert("Ce fichier n'est pas une sauvegarde valide ("+f.name+").");return}
      const list=d.events||(d.id&&d.players?[d]:null);
      if(!list||!list.length){alert("Aucun événement trouvé dans "+f.name);return}
      list.forEach(e=>{migrate(e);const ix=S.events.findIndex(x=>x.id===e.id);if(ix>=0)S.events[ix]=e;else S.events.unshift(e)});
      S.cur=list[0].id;save();toast(`${list.length} événement(s) importé(s) : ${list.map(e=>e.company).join(", ")}`);go("setup");render()};
    rd.readAsText(f)});
  i.click()}
function copy(t){navigator.clipboard.writeText(t).then(()=>toast("Copié — collez dans WhatsApp"),()=>{prompt("Copiez :",t)})}
function copyWA(){const e=ev();let t=`*${e.title} × ${e.company}*${e.date?"\n"+fmtDate(e.date):""}${e.time?" · "+e.time+(e.endTime?" – "+e.endTime:""):""}\n`;
  e.schedule.rounds.forEach(r=>{t+=`\n*Tour ${r.n}*${roundSlot(e,r.n-1)?" · "+slotTxt(e,r.n-1):""}\n`;r.matches.forEach(m=>t+=`T${m.court} : ${m.a.map(id=>pname(e,id)).join(" & ")}  vs  ${m.b.map(id=>pname(e,id)).join(" & ")}\n`);if(r.rest.length)t+=`Repos : ${r.rest.map(id=>pname(e,id)).join(", ")}\n`});copy(t)}
function copyRanking(){const e=ev();const{list}=ranking(e);const md=["🥇","🥈","🥉"];copy(`*${e.title} × ${e.company} — Classement*\n\n`+list.filter(s=>s.J).map(s=>`${md[s.rank-1]||s.rank+"."} ${s.p.name} — ${s.V} V · ${s.diff>0?"+":""}${s.diff} · ${s.GF} jeux`).join("\n"))}

/* score inputs — no full re-render while typing, so focus never jumps */
document.addEventListener("keydown",k=>{const t=k.target;if(!(t.classList&&t.classList.contains("sc")))return;
  if(k.key==="Enter"||k.key==="Tab"&&!k.shiftKey){k.preventDefault();commitScore(t);const all=[...document.querySelectorAll("input.sc")];const nx=all[all.indexOf(t)+1];if(nx){nx.focus();nx.select()}}});
document.addEventListener("input",k=>{const t=k.target;if(t.classList&&t.classList.contains("sc"))commitScore(t)});
function commitScore(t){const e=ev();const v=t.value.trim().replace(/\D/g,"").slice(0,2);if(t.value!==v)t.value=v;
  const m=e.schedule.rounds[+t.dataset.r].matches[+t.dataset.m];const k=t.dataset.s==="a"?"sa":"sb";if(m[k]===v)return;m[k]=v;save();
  const card=t.closest(".mt");if(card){const done=m.sa!==""&&m.sb!=="";card.classList.toggle("done",done);card.classList.toggle("win-a",done&&+m.sa>+m.sb);card.classList.toggle("win-b",done&&+m.sb>+m.sa)}
  const rp=document.getElementById("rkpanel");if(rp)rp.innerHTML=rankTable(e,false)}

render();
</script>
</body>
